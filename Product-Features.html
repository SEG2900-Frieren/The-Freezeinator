    <style type="text/css">
       *{
        text-decoration: none;
      }
      .navbar{
        position: fixed;              
        top: 30px;                
        left: 50%;                     
        transform: translateX(-50%);    
        background: rgba(255, 255, 255, 0.85);  
        border-radius: 25px;          
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); 
        font-family: 'arial', arial;
        font-size: 20px;
        padding: 12px 40px;
        z-index: 9999;

      }
      .navdiv{
        display:flex;align-items:center;justify-content:space-between;
      }
      ul{
        list-style-type: none;
        display: flex;
        gap: 30px;
        margin: 0;
        padding: 0;
      }

      li a {
        color: black;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s
      }
      li a:hover {
        color: hsl(213, 100%, 76%);
      }

      .dropdown__navbar {
        display: none;
        position: absolute;
        left: 0;
        top: 100%;
        background-color: rgba(202, 251, 251, 0.8);
        border-radius: 8px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.3s;
        z-index: 10;
      }

      .dropdown__navbar ul {
        display: block;
        margin: 0;
        padding: 0;

      }

      .dropdown__navbar ul li {
        display: block;
        width: 150px;
        padding: 10px 20px;
        text-align: left;
      }

      .dropdown__navbar ul li:hover {
        background-color: aliceblue;

      }

      .navbar ul li:hover .dropdown__navbar {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }  
    </style>
